                <p>When your period arrives, the foods you choose can play a meaningful role in how you feel throughout the day. Many people experience symptoms such as cramps, bloating, fatigue, mood changes, and food cravings during their menstrual cycle. While there is no single food that can eliminate every symptom, a balanced diet rich in nutrient-dense ingredients may help support comfort, energy, and overall well-being.</p>

<div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Why Nutrition Matters During Your Period</h2>

<p>Your menstrual cycle places unique demands on your body. Hormonal fluctuations can affect appetite, digestion, energy levels, and emotional well-being. During this time, nutritional support becomes especially important.</p>

<p>Many common period symptoms are linked to factors such as inflammation, fluid retention, changes in blood sugar levels, and nutrient loss. Choosing wholesome foods can help your body manage these challenges more effectively.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Consistency matters more than perfection. Building a nutrient-rich eating pattern throughout the month can often provide greater benefits than making drastic dietary changes only when symptoms appear.</p>

<p>Rather than focusing on restrictive diets, it is often more helpful to prioritize foods that provide nourishment, hydration, and sustained energy. The foods highlighted below are popular choices because they offer nutrients that support the body during menstruation.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Dark Chocolate: A Comforting Mood Booster</h2>

<p>Dark chocolate is often considered one of the most satisfying treats during a period. Beyond its rich flavor, it contains minerals such as magnesium and iron, making it a more nutrient-dense choice compared to many sugary snacks.</p>

<p>Many people find that dark chocolate helps satisfy cravings while also providing a sense of comfort. Its rich cocoa content contains plant compounds that contribute to its reputation as a feel-good food.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Ways to Enjoy Dark Chocolate</h3>

<li>Blend cocoa into a smoothie.</li>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Leafy Greens for Iron and Vital Nutrients</h2>

<p>In addition to iron, leafy greens contain vitamins, minerals, antioxidants, and fiber. These nutrients support overall health and can contribute to sustained energy levels.</p>

<div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:28px 0;">

        // Function to render a single post detail view
        function renderPost(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) {
                app.innerHTML = `<p style="color: var(--text-color);">Post not found.</p><a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>`;
                return;
            }
            app.innerHTML = `
                <a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>
                <div class="single-post">
                    <div class="post-header">
                        <img class="avatar" src="${avatarUrl}" alt="Avatar">
                        <span class="username">${blogUsername}</span>
                    </div>
                    <img class="post-image" src="${post.image}" alt="${post.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/540x400?text=Image+Not+Found'">
                    <div class="post-content">
                        <h1>${post.title}</h1>
                        ${post.content}
                    </div>
                    <div class="post-footer">
                        <span>${post.date}</span>
                        <span style="letter-spacing: 2px; font-size: 1rem; color: var(--primary-color);">↻ ♥</span>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0); // Smooth scroll to top
        }

        // Client-side router navigation logic
        function navigate(view, id = null) {
            if (view === 'home') {
                window.location.hash = '';
                renderHome();
            } else if (view === 'post') {
                window.location.hash = id;
                renderPost(id);
            } else if (view === 'page') {
                window.location.hash = id;
                renderPage(id);
            }
        }

        // Listen for browser navigation interactions (back/forward hashes)
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                if (pages[hash]) {
                    renderPage(hash);
                } else {
                    renderPost(hash);
                }
            } else {
                renderHome();
            }
        });

        // Initialize view router on fresh load
        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
            if (pages[initialHash]) {
                renderPage(initialHash);
            } else {
                renderPost(initialHash);
            }
        } else {
            renderHome();
        }
    </script>
</body>
</html>
